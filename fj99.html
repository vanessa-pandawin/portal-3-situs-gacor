.machine{

.bolt{position:absolute;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#333333,#1a1a1a 60%,#0a0a0a);border:1px solid #174d12;box-shadow:inset 0 1px 2px rgba(255,255,255,0.08),0 1px 3px rgba(0,0,0,0.8)}

.bolt.tl{top:10px;left:10px}.bolt.tr{top:10px;right:10px}
.bolt.bl{bottom:10px;left:10px}.bolt.br{bottom:10px;right:10px}

.neon-sign{

}

.chrome-strip{

.rgb-box{

@keyframes rgbMove{0%{background-position:0% 50%}100%{background-position:400% 50%}}
